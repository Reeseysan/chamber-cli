[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chamber-cli"
version = "0.2.2"
description = "Private expert panels in your terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Secundus Nulli LLC" }]
keywords = ["ai", "privacy", "cli", "multi-agent", "discussion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "prompt-toolkit>=3.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pydantic>=2.0",
]

[project.scripts]
chamber = "chamber.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
docs = [
    "pymupdf>=1.24",
    "python-docx>=1.0",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
